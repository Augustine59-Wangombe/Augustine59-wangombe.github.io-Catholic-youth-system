
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Youths dashboard</title>

  <!-- Firebase Auth -->
  <script type="module">
    import { getAuth, onAuthStateChanged } from
    "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    const auth = getAuth();
    onAuthStateChanged(auth, (user) => {
      if (!user) window.location.href = "index.html";
    });
  </script>

  <style>
    body {
      background: rgb(0, 110, 255);
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .H1, .H2 {
      color: whitesmoke;
      text-align: center;
    }

    .IMG1 {
      width: 100%;
      max-width: 1200px;
      display: block;
      margin: auto;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      justify-items: center;
      margin: 20px;
    }

    .gallery img {
      max-width: 200px;
      border-radius: 10px;
      transition: transform 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.1);
    }

    /* SLID
    .slider {
      position: relative;
      max-width: 1200px;
      margin: 40px auto;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      width: 100%;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }

    .slide.active {
      opacity: 1;
      position: relative;
    }

    .slide img {
      width: 100%;
      display: block;
    }

    .caption {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
    }
  </style>
</head>

<body>

<h1 class="H1">Welcome to the Nyeri Catholic Youth Computerized System</h1>

<img class="IMG1" src="images/file_0000000051047230a592fd301e83b357.png">

<h2 class="H2">Click the icons to Explore</h2>

<div class="gallery">
  <img src="images/download.png" onclick="Quovadis()">
  <img src="images/download (1).png" onclick="poly()">
  <img src="images/download (2).png" onclick="outspan()">
</div>

<!-- SLIDER -->
<div class="slider">
  <div class="slide active">
    <img src="images/divine-mercy-jesus-digital-painting-done-photoshop-182548279.jpg">
    <div class="caption">Psalms 147:3 He heals the brokenhearted</div>
  </div>

  <div class="slide">
    <img src="images/Screenshot (124)_023050.png">
    <div class="caption">Hope does not disappoint</div>
  </div>

  <div class="slide">
    <img src="images/9c4933ac921ad2a342bb3c46fb0e29e0.jpg">
    <div class="caption">John 6:37 I will never drive them away</div>
  </div>

  <div class="slide">
    <img src="images/file_0000000058d47230b4d8ccd856b4c62c.png">
    <div class="caption">Philippians 4:13</div>
  </div>
</div>

<script>
  const slides = document.querySelectorAll(".slide");
  let index = 0;

  setInterval(() => {
    slides[index].classList.remove("active");
    index = (index + 1) % slides.length;
    slides[index].classList.add("active");
  }, 5000);
</script>

</body>
</html>￼Enter
